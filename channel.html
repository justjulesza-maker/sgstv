<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Show</title>
<link rel="stylesheet" href="/app.css">
<style>
  .ch-hero.over-bg { background: linear-gradient(140deg, color-mix(in srgb, var(--c) 80%, transparent), color-mix(in srgb, var(--bg) 55%, transparent)); backdrop-filter: blur(2px); }
  .ch-hero { margin-top: 24px; border-radius: 22px; padding: clamp(22px, 4vw, 44px); background: linear-gradient(140deg, var(--c), color-mix(in srgb, var(--c) 25%, var(--bg))); display: grid; gap: 24px; align-items: center; grid-template-columns: 1fr; border: 1px solid var(--line); }
  @media (min-width: 760px) { .ch-hero { grid-template-columns: auto 1fr; } }
  .ch-hero img { max-height: 140px; max-width: 260px; object-fit: contain; }
  .ch-hero h1 { font-size: clamp(32px, 5vw, 56px); }
  .ch-hero p { margin: 10px 0 0; color: rgba(255,255,255,.88); max-width: 680px; }
  .live-banner { margin-top: 18px; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 14px 18px; border-radius: 14px; background: color-mix(in srgb, var(--live) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--live) 50%, transparent); }
</style>
</head>
<body data-page="channel">
<header id="ff-header"></header>
<main class="wrap" id="main"><div class="empty" style="margin-top:40px">Loading…</div></main>
<footer id="ff-footer"></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
<script>
FF.onReady(async () => {
  const esc = FF.esc, key = FF.qs('c') || '';
  const channels = await FF.loadChannels();
  const ch = channels.find(c => c.slug === key || c.id === key);
  const main = document.getElementById('main');
  if (!ch) { main.innerHTML = '<div class="empty" style="margin-top:40px">Show not found. <a href="/"><u>Back home</u></a></div>'; return; }
  document.title = `${ch.name} · ${FF.site.name}`;
  if (ch.accent) document.documentElement.style.setProperty('--brand', ch.accent);
  FF.setBackdrop(ch.bgImage || FF.site.bgImage, 'medium');
  const vids = await FF.publishedVideos(ch.id);
  const live = vids.filter(v => v.isLive);
  const upcoming = vids.filter(v => !v.isLive && v.scheduledAt && FF.ms(v.scheduledAt) > Date.now()).sort((a, b) => FF.ms(a.scheduledAt) - FF.ms(b.scheduledAt));
  const eps = vids.filter(v => !v.isLive && !upcoming.includes(v));
  main.innerHTML = `
    <section class="ch-hero ${ch.bgImage || FF.site.bgImage ? 'over-bg' : ''}" style="--c:${esc(ch.color || '#1d4e7a')}">
      ${ch.logoUrl ? `<img src="${esc(ch.logoUrl)}" alt="${esc(ch.name)}">` : ''}
      <div><h1>${esc(ch.name)}</h1>${ch.tagline ? `<p><b>${esc(ch.tagline)}</b></p>` : ''}${ch.description ? `<p>${esc(ch.description)}</p>` : ''}</div>
    </section>
    ${live.map(v => `<a class="live-banner" href="/watch.html?v=${encodeURIComponent(v.id)}"><span><span class="badge live" style="position:static">● LIVE</span> &nbsp;<b>${esc(v.title)}</b></span><span class="btn small">Watch live ▸</span></a>`).join('')}
    ${upcoming.length ? `<section class="section"><div class="section-head"><h2>Coming up</h2></div><div class="grid">${upcoming.map(v => FF.videoCard(v, ch)).join('')}</div></section>` : ''}
    <section class="section"><div class="section-head"><h2>Episodes</h2><span class="muted">${eps.length} set${eps.length === 1 ? '' : 's'}</span></div>
      <div class="grid">${eps.map(v => FF.videoCard(v, ch)).join('') || '<div class="empty">No episodes yet.</div>'}</div></section>`;
});
FF.boot();
</script>
</body>
</html>
